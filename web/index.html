<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Fleet Mission Control</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23ffac00'/><path d='M16 7 L23 16 L16 25 L9 16 Z' fill='none' stroke='%23151515' stroke-width='2.6' stroke-linejoin='round'/><circle cx='16' cy='16' r='2.4' fill='%23151515'/></svg>" />
    <script>
      // Apply Day/Night before first paint so night mode doesn't flash white (mirrors useTheme)
      try {
        var t = localStorage.getItem('fmc-theme')
        document.documentElement.dataset.theme = t === 'day' || t === 'night' ? t
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day')
      } catch (e) { document.documentElement.dataset.theme = 'day' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
