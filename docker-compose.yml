services:
  # ============================================================================
  # Go Telemetry Ingest Gateway & Mission Control API
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-gateway
    restart: unless-stopped
    ports:
      # TCP socket for binary Protobuf vehicle telemetry & signed commands
      - "8080:8080"
      # HTTP REST API & WebSocket streams (live twins & alerts)
      - "8081:8081"
    environment:
      - FLEET_API_ADDR=0.0.0.0:8081
      - FLEET_ALLOWED_ORIGINS=*
    volumes:
      # Persists ECDSA Root of Trust keys (fleet_private.pem & fleet_public.pem)
      - ./certs:/app/certs

  # ============================================================================
  # Connected EV Fleet Simulator (California routes & ISO-26262 safety)
  # ============================================================================
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: fleet-simulator
    restart: unless-stopped
    depends_on:
      - gateway
    command: ["-addr", "gateway:8080", "-n", "20"]
    volumes:
      # Reads shared fleet ECDSA public key generated by the gateway
      - ./certs:/app/certs:ro

  # ============================================================================
  # Optional: Self-hosted Web Frontend (Nginx serving React SPA + /api proxy)
  # Run with: docker compose --profile full up -d
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: fleet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway
    profiles:
      - full
